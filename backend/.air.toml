# Hot reload for `make dev` (go tool air). Rebuilds the API on Go/SQL changes.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "bin", "vendor"]
  exclude_regex = ["_test\\.go$"]
  delay = 300
  kill_delay = "3s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
