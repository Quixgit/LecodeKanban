openapi: 3.0.3
info:
  title: LecodeKanban API
  version: 0.3.0
  description: |
    REST API of LecodeKanban. Source of truth for Go DTOs and the TypeScript client (`make gen`).

    **Auth:** httpOnly cookies — `lk_at` (access, ~15 min) and `lk_rt` (rotating refresh,
    path-scoped to `/api/v1/auth`). **CSRF:** every non-GET request must echo the `lk_csrf`
    cookie in the `X-CSRF-Token` header (obtain it via `GET /auth/csrf`).

    **Errors** are `{"error": {"code", "message", "fields"?, "meta"?}}`. `code` is stable and
    translated by clients; `message` is an English developer hint. See `GET /i18n/error-codes`.
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: users
  - name: workspaces
  - name: projects
  - name: boards
  - name: cards
  - name: comments
  - name: customFields
  - name: attachments
  - name: time
  - name: wiki
  - name: chat
  - name: notifications
  - name: integrations
  - name: github
  - name: activity
  - name: realtime
  - name: system

paths:
  /auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrf
      summary: Issue the CSRF cookie
      security: []
      responses:
        "200":
          description: CSRF token (also set as the lk_csrf cookie)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfToken" }
  /auth/providers:
    get:
      tags: [auth]
      operationId: getAuthProviders
      summary: Which OAuth providers are configured
      security: []
      responses:
        "200":
          description: Provider availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthProviders" }
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      security: []
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security: []
      responses:
        "204": { description: Logged out (cookies cleared) }
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "204": { description: Email verified }
        "400": { $ref: "#/components/responses/Error" }
  /auth/verify-email/resend:
    post:
      tags: [auth]
      operationId: resendVerification
      responses:
        "204": { description: Verification email queued (no-op if already verified) }
        "429": { $ref: "#/components/responses/Error" }
  /auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "204": { description: Always succeeds to avoid account enumeration }
        "429": { $ref: "#/components/responses/Error" }
  /auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Password changed; all sessions revoked }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/oauth/{provider}/start:
    get:
      tags: [auth]
      operationId: oauthStart
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: next
          in: query
          description: Relative path to return to after sign-in
          schema: { type: string }
      responses:
        "302": { description: Redirect to the provider }
        "404": { $ref: "#/components/responses/Error" }
  /auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      operationId: oauthCallback
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: "Redirect back to the app (with ?error=<code> on failure)" }

  /users/me:
    get:
      tags: [users]
      operationId: getMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      tags: [users]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/Error" }
  /users/me/avatar:
    post:
      tags: [users]
      operationId: uploadAvatar
      summary: Upload a profile picture (PNG, JPEG, WebP or GIF, up to 2 MB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [users]
      operationId: removeAvatar
      summary: Remove the profile picture
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /users/{userId}/avatar:
    parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [users]
      operationId: getAvatar
      summary: A user's uploaded profile picture (signed-in users only)
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
  /users/me/cover:
    post:
      tags: [users]
      operationId: uploadCover
      summary: Upload a profile background (PNG, JPEG, WebP or GIF, up to 5 MB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [users]
      operationId: removeCover
      summary: Remove the uploaded profile background
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
  /users/{userId}/cover:
    parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [users]
      operationId: getCover
      summary: A user's uploaded profile background (signed-in users only)
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
  /users/me/sessions:
    get:
      tags: [users]
      operationId: listDevices
      summary: Where the caller is signed in
      responses:
        "200":
          description: Devices, most recently active first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }
  /users/me/sessions/revoke-others:
    post:
      tags: [users]
      operationId: signOutOtherDevices
      summary: Sign out everywhere except this device
      responses:
        "204": { description: Signed out }
  /users/me/sessions/{sessionId}:
    parameters: [{ name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [users]
      operationId: signOutDevice
      summary: Sign one device out
      responses:
        "204": { description: Signed out }
        "404": { $ref: "#/components/responses/Error" }
  /auth/login/two-factor:
    post:
      tags: [auth]
      operationId: loginTwoFactor
      summary: Finish a sign-in with the code from the authenticator app (or a recovery code)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorLoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /users/me/two-factor:
    get:
      tags: [users]
      operationId: getTwoFactor
      responses:
        "200":
          description: Whether two-factor authentication is on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorStatus" }
  /users/me/two-factor/setup:
    post:
      tags: [users]
      operationId: setupTwoFactor
      summary: Generate a secret to scan; nothing changes until a code is confirmed
      responses:
        "200":
          description: Secret and otpauth address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorSetup" }
        "409": { $ref: "#/components/responses/Error" }
  /users/me/two-factor/enable:
    post:
      tags: [users]
      operationId: enableTwoFactor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Turned on; the recovery codes are shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /users/me/two-factor/disable:
    post:
      tags: [users]
      operationId: disableTwoFactor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorDisableRequest" }
      responses:
        "204": { description: Turned off }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /users/me/two-factor/recovery-codes:
    post:
      tags: [users]
      operationId: regenerateRecoveryCodes
      summary: Replace the recovery codes (needs a valid code)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: The new codes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "422": { $ref: "#/components/responses/Error" }
  /users/me/notification-prefs:
    get:
      tags: [notifications]
      operationId: getNotificationPrefs
      summary: Which kinds of notification the caller wants (all on unless switched off)
      responses:
        "200":
          description: One entry per kind
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPrefs" }
    put:
      tags: [notifications]
      operationId: setNotificationPref
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPrefInput" }
      responses:
        "204": { description: Saved }
        "422": { $ref: "#/components/responses/Error" }
  /users/me/password:
    post:
      tags: [users]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed; other sessions revoked }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: Workspaces the caller belongs to (a personal one is created on first call if none)
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "422": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspaces]
      operationId: getWorkspace
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [workspaces]
      operationId: updateWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [workspaces]
      operationId: deleteWorkspace
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/settings:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspaces]
      operationId: getWorkspaceSettings
      summary: The workspace's rules and feature switches (any member)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSettings" }
    patch:
      tags: [workspaces]
      operationId: updateWorkspaceSettings
      summary: Change settings (administrators); changes are written to the audit log
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceSettingsPatch" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSettings" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/audit:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspaces]
      operationId: listWorkspaceAudit
      summary: The latest administrator actions (administrators)
      responses:
        "200":
          description: Entries, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
  /workspaces/{workspaceId}/roles:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspaces]
      operationId: listRoles
      summary: The permission catalog and every role of the workspace (any member)
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolesOverview" }
    post:
      tags: [workspaces]
      operationId: createRole
      summary: Define a custom role (people who may manage roles)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleDefinition" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/roles/{roleKey}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { name: roleKey, in: path, required: true, schema: { type: string }, description: "admin, member or viewer, or the id of a custom role" }
    put:
      tags: [workspaces]
      operationId: setRolePermissions
      summary: Change what a built-in role (admin, member, viewer) may do in this workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionsInput" }
      responses:
        "204": { description: Saved }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    patch:
      tags: [workspaces]
      operationId: updateRole
      summary: Change a custom role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleDefinition" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [workspaces]
      operationId: deleteRole
      summary: Delete a custom role; its people go back to the built-in role it ranked as
      responses:
        "204": { description: Deleted }
  /workspaces/{workspaceId}/roles/{roleKey}/reset:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { name: roleKey, in: path, required: true, schema: { type: string } }
    post:
      tags: [workspaces]
      operationId: resetRole
      summary: Put a built-in role back to its default permissions
      responses:
        "204": { description: Reset }
  /workspaces/{workspaceId}/members/{userId}/custom-role:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [workspaces]
      operationId: assignCustomRole
      summary: Give a member a custom role, or null to go back to their built-in role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId: { type: string, format: uuid, nullable: true }
      responses:
        "204": { description: Saved }
        "403": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/mail:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspaces]
      operationId: getMailStatus
      summary: How email leaves this server, the queue, and the latest emails to this workspace's people (administrators)
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailStatus" }
  /workspaces/{workspaceId}/mail/test:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    post:
      tags: [workspaces]
      operationId: sendTestMail
      summary: Send a test email to the caller (administrators)
      responses:
        "202": { description: Queued }
  /workspaces/{workspaceId}/members:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspaces]
      operationId: listMembers
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [workspaces]
      operationId: getMemberProfile
      summary: A teammate's profile card
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberProfile" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [workspaces]
      operationId: updateMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemberRequest" }
      responses:
        "204": { description: Role updated }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [workspaces]
      operationId: removeMember
      summary: Remove a member (or leave, when userId is the caller)
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/invites:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspaces]
      operationId: listInvites
      responses:
        "200":
          description: Open invites
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invite" }
    post:
      tags: [workspaces]
      operationId: createInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInviteRequest" }
      responses:
        "201":
          description: Invite created and emailed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - { name: inviteId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [workspaces]
      operationId: revokeInvite
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /invites/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      tags: [workspaces]
      operationId: previewInvite
      security: []
      responses:
        "200":
          description: Invite details for the acceptance screen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "404": { $ref: "#/components/responses/Error" }
  /invites/{token}/accept:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      tags: [workspaces]
      operationId: acceptInvite
      responses:
        "200":
          description: Joined workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "403": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/projects:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [projects]
      operationId: listProjects
      parameters:
