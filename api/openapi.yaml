        author: { allOf: [{ $ref: "#/components/schemas/PersonRef" }], nullable: true }
        body: { type: string, description: "Markdown; mentions are written as @[Name](user-id). Empty when deleted" }
        event: { allOf: [{ $ref: "#/components/schemas/ChatEvent" }], nullable: true, description: A task update (feed messages) }
        meeting: { allOf: [{ $ref: "#/components/schemas/ChatMeeting" }], nullable: true, description: A calendar meeting reminder }
        deleted: { type: boolean }
        mentions: { type: array, items: { $ref: "#/components/schemas/PersonRef" } }
        mentionAll: { type: boolean, description: "@channel, @here or @everyone" }
        reactions: { type: array, items: { $ref: "#/components/schemas/ChatReaction" } }
        files: { type: array, items: { $ref: "#/components/schemas/ChatFile" } }
        pinned: { type: boolean }
        saved: { type: boolean, description: In the caller's Later list }
        replyCount: { type: integer }
        replyPeople: { type: array, items: { $ref: "#/components/schemas/PersonRef" }, description: Up to three people who replied, latest first }
        lastReplyAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time, nullable: true }
    ChatMessagePage:
      type: object
      required: [messages, hasMore]
      properties:
        messages: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
        hasMore: { type: boolean }
    ChatMessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 8000, description: May be empty when fileIds is not }
        parentId: { type: string, format: uuid, nullable: true }
        fileIds: { type: array, maxItems: 10, items: { type: string, format: uuid }, description: Uploaded files to attach }
    ChatFile:
      type: object
      required: [id, name, contentType, size, url, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }
        url: { type: string }
        createdAt: { type: string, format: date-time }
    ChatEvent:
      type: object
      required: [kind, projectId, projectKey, projectName, cardId, number, title]
      properties:
        kind: { type: string, enum: [created, assigned, moved, updated, deleted, commented] }
        actorId: { type: string, format: uuid, description: Who made the change }
        actorName: { type: string }
        assignees: { type: array, items: { type: string }, description: People on a newly created task }
        projectId: { type: string, format: uuid }
        projectKey: { type: string }
        projectName: { type: string }
        cardId: { type: string, format: uuid }
        number: { type: integer }
        title: { type: string }
        from: { type: string, description: Previous status of a move }
        to: { type: string, description: New status of a move, or the status of a new task }
        column: { type: string }
        excerpt: { type: string, description: Start of a new comment }
        changes:
          type: array
          items:
            type: object
            required: [field]
            properties:
              field: { type: string }
              from: { type: string }
              to: { type: string }
              added: { type: array, items: { type: string } }
              removed: { type: array, items: { type: string } }
    ChatHit:
      type: object
      required: [message, channel]
      properties:
        message: { $ref: "#/components/schemas/ChatMessage" }
        channel: { $ref: "#/components/schemas/ChatChannel" }
    ChatPresence:
      type: object
      required: [online, statuses]
      properties:
        online: { type: array, items: { type: string, format: uuid } }
        statuses: { type: array, items: { $ref: "#/components/schemas/ChatStatus" }, description: Statuses in force }
    ChatStatus:
      type: object
      required: [userId, kind, icon, text, until]
      properties:
        userId: { type: string, format: uuid }
        kind: { type: string, enum: [available, busy, dnd, away] }
        icon: { type: string, nullable: true, enum: [calendar-clock, headphones, coffee, utensils, car, house, plane, thermometer, null] }
        text: { type: string, maxLength: 100 }
        until: { type: string, format: date-time, nullable: true }
    ChatStatusInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [available, busy, dnd, away] }
        icon: { type: string, nullable: true, enum: [calendar-clock, headphones, coffee, utensils, car, house, plane, thermometer, null] }
        text: { type: string, maxLength: 100 }
        until: { type: string, format: date-time, nullable: true, description: When the status ends; omit to keep it until changed }
    ChatBodyInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 8000 }
security:
  - cookieAuth: []
