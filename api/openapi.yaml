      tags: [wiki]
      operationId: listWikiTrash
      description: Deleted subtrees the caller may restore (editors and owners), newest first; kept 30 days
      responses:
        "200":
          description: Trash
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WikiTrashItem" } }
  /workspaces/{workspaceId}/wiki/favorites:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [wiki]
      operationId: listWikiFavorites
      responses:
        "200":
          description: The caller's starred nodes they can still see
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WikiNode" } }
  /workspaces/{workspaceId}/wiki/recent:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [wiki]
      operationId: listWikiRecent
      responses:
        "200":
          description: Last opened nodes (max 20)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WikiNode" } }
  /workspaces/{workspaceId}/wiki/shared:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [wiki]
      operationId: listWikiSharedWithMe
      description: Nodes somebody else explicitly shared with the caller (directly or through a team)
      responses:
        "200":
          description: Nodes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WikiNode" } }
  /workspaces/{workspaceId}/wiki/private:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [wiki]
      operationId: listWikiMyPrivate
      description: The caller's own nodes whose effective visibility is private
      responses:
        "200":
          description: Nodes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WikiNode" } }
  /wiki/spaces/{spaceId}:
    parameters: [{ $ref: "#/components/parameters/WikiSpaceId" }]
    get:
      tags: [wiki]
      operationId: getWikiSpace
      responses:
        "200":
          description: Space
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiSpace" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [wiki]
      operationId: updateWikiSpace
      description: Owner only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WikiSpacePatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiSpace" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [wiki]
      operationId: deleteWikiSpace
      description: Owner only. Permanently removes the space and all its pages
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
  /wiki/spaces/{spaceId}/tree:
    parameters: [{ $ref: "#/components/parameters/WikiSpaceId" }]
    get:
      tags: [wiki]
      operationId: getWikiTree
      description: |
        Every node of the space the caller may see, ordered by depth then rank. Nodes the caller
        may not see are omitted entirely. A node whose parent is hidden from the caller has
        `detached: true` and `parentId: null`.
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiTree" }
        "404": { $ref: "#/components/responses/Error" }
  /wiki/spaces/{spaceId}/nodes:
    parameters: [{ $ref: "#/components/parameters/WikiSpaceId" }]
    post:
      tags: [wiki]
      operationId: createWikiNode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WikiNodeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiNode" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /wiki/spaces/{spaceId}/audit:
    parameters:
      - { $ref: "#/components/parameters/WikiSpaceId" }
      - { name: before, in: query, schema: { type: integer, format: int64 }, description: Cursor from the previous page }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
    get:
      tags: [wiki]
      operationId: listWikiAudit
      description: Sharing, visibility, move, delete and restore history. Owner only
      responses:
        "200":
          description: Events, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiAuditPage" }
        "403": { $ref: "#/components/responses/Error" }
  /wiki/spaces/{spaceId}/access:
    parameters: [{ $ref: "#/components/parameters/WikiSpaceId" }]
    get:
      tags: [wiki]
      operationId: getWikiSpaceAccess
      responses:
        "200":
          description: Effective access summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiAccessSummary" }
  /wiki/spaces/{spaceId}/visibility:
    parameters: [{ $ref: "#/components/parameters/WikiSpaceId" }]
    put:
      tags: [wiki]
      operationId: setWikiSpaceVisibility
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WikiVisibilityInput" }
      responses:
        "200":
          description: Updated summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiAccessSummary" }
        "403": { $ref: "#/components/responses/Error" }
  /wiki/spaces/{spaceId}/permissions/{kind}/{principalId}:
    parameters:
      - { $ref: "#/components/parameters/WikiSpaceId" }
      - { $ref: "#/components/parameters/WikiPrincipalKind" }
      - { $ref: "#/components/parameters/WikiPrincipalId" }
    put:
      tags: [wiki]
      operationId: setWikiSpaceGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WikiGrantInput" }
      responses:
        "200":
          description: Grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiGrant" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [wiki]
      operationId: removeWikiSpaceGrant
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Error" }
  /wiki/nodes/{nodeId}:
    parameters: [{ $ref: "#/components/parameters/WikiNodeId" }]
    get:
      tags: [wiki]
      operationId: getWikiNode
      description: Also records the node in the caller's recents
      responses:
        "200":
          description: Node
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiNode" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [wiki]
      operationId: updateWikiNode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WikiNodePatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiNode" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [wiki]
      operationId: deleteWikiNode
      description: Moves the node and its subtree to the trash
      responses:
        "204": { description: Trashed }
        "403": { $ref: "#/components/responses/Error" }
  /wiki/nodes/{nodeId}/move:
    parameters: [{ $ref: "#/components/parameters/WikiNodeId" }]
    post:
      tags: [wiki]
      operationId: moveWikiNode
      description: |
        Re-parents or reorders a subtree (also across spaces). Answers 409 `wiki.confirm_widening`
        when the new location would let more people read the node; repeat with `confirmWiden: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WikiMoveInput" }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiNode" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /wiki/nodes/{nodeId}/restore:
    parameters: [{ $ref: "#/components/parameters/WikiNodeId" }]
    post:
      tags: [wiki]
      operationId: restoreWikiNode
      description: Restores a trashed subtree in place, or at the space root when its parent is gone
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiNode" }
        "409": { $ref: "#/components/responses/Error" }
  /wiki/nodes/{nodeId}/purge:
    parameters: [{ $ref: "#/components/parameters/WikiNodeId" }]
    delete:
      tags: [wiki]
      operationId: purgeWikiNode
      description: Permanently deletes a trashed subtree. Owner only
      responses:
        "204": { description: Purged }
        "409": { $ref: "#/components/responses/Error" }
  /wiki/nodes/{nodeId}/content:
    parameters: [{ $ref: "#/components/parameters/WikiNodeId" }]
    get:
      tags: [wiki]
      operationId: getWikiContent
      responses:
        "200":
          description: The page document (an empty one at version 0 until something is saved)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiContent" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [wiki]
      operationId: saveWikiContent
      description: |
        Autosave. The document is validated against an allow-list of node types, marks, attributes
        and link targets. Answers 409 `wiki.content_conflict` when `version` is stale.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WikiContentInput" }
      responses:
        "200":
          description: Saved; the new version is in the response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiContent" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /wiki/nodes/{nodeId}/files:
    parameters: [{ $ref: "#/components/parameters/WikiNodeId" }]
    post:
      tags: [wiki]
      operationId: uploadWikiFile
      description: Multipart upload (field `file`) of an image or attachment for the page. Editors only
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiFile" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /wiki/spaces/{spaceId}/export:
    parameters: [{ $ref: "#/components/parameters/WikiSpaceId" }]
    get:
      tags: [wiki]
      operationId: exportWikiSpace
      summary: Download every page of the space the caller can read, as a zip of Markdown or HTML files
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [md, html], default: md } }
      responses:
        "200": { description: A zip with the folder structure, an index and the attachments }
        "404": { $ref: "#/components/responses/Error" }
  /wiki/nodes/{nodeId}/export:
    parameters: [{ $ref: "#/components/parameters/WikiNodeId" }]
    get:
      tags: [wiki]
      operationId: exportWikiNode
      summary: Download a page (one file when it has no attachments, else a zip) or, with subtree, a folder and everything below it
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [md, html], default: md } }
        - { name: subtree, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { description: A Markdown or HTML file, or a zip }
        "404": { $ref: "#/components/responses/Error" }
  /wiki/files/{fileId}/content:
    parameters: [{ name: fileId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [wiki]
      operationId: getWikiFile
      description: Bytes of an uploaded file for anybody who can read its page. Only known image types may be shown inline
      responses:
        "200": { description: File bytes }
        "404": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/wiki/templates:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
    get:
      tags: [wiki]
      operationId: listWikiTemplates
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [en, uk] } }
      responses:
        "200":
          description: Built-in templates (in the requested language) followed by the workspace's own
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WikiTemplate" } }
    post:
      tags: [wiki]
      operationId: createWikiTemplate
      description: Saves a page as a custom template. Workspace admins only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WikiTemplateInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiTemplate" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/wiki/templates/{templateId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [wiki]
      operationId: deleteWikiTemplate
      description: Workspace admins only
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
  /wiki/nodes/{nodeId}/favorite:
    parameters: [{ $ref: "#/components/parameters/WikiNodeId" }]
    put:
      tags: [wiki]
      operationId: favoriteWikiNode
      responses:
        "204": { description: Starred }
    delete:
      tags: [wiki]
      operationId: unfavoriteWikiNode
      responses:
        "204": { description: Unstarred }
  /wiki/nodes/{nodeId}/access:
    parameters: [{ $ref: "#/components/parameters/WikiNodeId" }]
    get:
      tags: [wiki]
      operationId: getWikiNodeAccess
      responses:
        "200":
          description: Effective access summary (grants are listed for editors and owners only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiAccessSummary" }
  /wiki/nodes/{nodeId}/visibility:
    parameters: [{ $ref: "#/components/parameters/WikiNodeId" }]
    put:
      tags: [wiki]
      operationId: setWikiNodeVisibility
      description: "Owner only. A null `visibility` makes the node inherit again"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WikiVisibilityInput" }
      responses:
        "200":
          description: Updated summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiAccessSummary" }
        "403": { $ref: "#/components/responses/Error" }
  /wiki/nodes/{nodeId}/permissions/{kind}/{principalId}:
    parameters:
      - { $ref: "#/components/parameters/WikiNodeId" }
      - { $ref: "#/components/parameters/WikiPrincipalKind" }
      - { $ref: "#/components/parameters/WikiPrincipalId" }
    put:
      tags: [wiki]
      operationId: setWikiNodeGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WikiGrantInput" }
      responses:
        "200":
          description: Grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WikiGrant" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [wiki]
      operationId: removeWikiNodeGrant
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Error" }

  /i18n/error-codes:
    get:
      tags: [system]
      operationId: listErrorCodes
      security: []
      responses:
        "200":
          description: Every error code the API can return
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /workspaces/{workspaceId}/chat/channels:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [chat]
      operationId: listChatChannels
      summary: Channels the caller can see, with unread and mention counts
      responses:
        "200":
          description: Public channels plus the caller's private channels and direct messages
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatChannel" } }
    post:
      tags: [chat]
      operationId: createChatChannel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatChannelInput" }
      responses:
        "201":
          description: Created; the caller is a member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatChannel" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/chat/direct:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    post:
      tags: [chat]
      operationId: openChatDirect
      summary: Open (or create) the direct conversation with the given people
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatDirectInput" }
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatChannel" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/chat:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [chat]
      operationId: openProjectChat
      summary: The project's conversation (created on first use; the caller joins it)
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatChannel" }
  /cards/{cardId}/chat:
    parameters: [{ $ref: "#/components/parameters/CardId" }]
    post:
      tags: [chat]
      operationId: openCardChat
      summary: The card's conversation (created on first use; the caller joins it)
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatChannel" }
  /workspaces/{workspaceId}/chat/search:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [chat]
      operationId: searchChat
      summary: Find messages containing the text in conversations the caller can see
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Text to find; two characters at least unless a filter is set }
        - { name: channelId, in: query, schema: { type: string, format: uuid }, description: Only this conversation }
        - { name: fromId, in: query, schema: { type: string, format: uuid }, description: Only messages by this person }
        - { name: mentionsMe, in: query, schema: { type: boolean }, description: Only messages that mention the caller (or @channel) }
        - { name: hasLink, in: query, schema: { type: boolean } }
        - { name: hasFile, in: query, schema: { type: boolean } }
        - { name: threadsOnly, in: query, schema: { type: boolean }, description: Only replies and messages that have replies }
        - { name: after, in: query, schema: { type: string, format: date-time } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Messages with the conversation each one lives in
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatHit" } }
  /workspaces/{workspaceId}/chat/saved:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [chat]
      operationId: listSavedChat
      summary: The caller's saved (Later) messages, newest saved first
      responses:
        "200":
          description: Messages with the conversation each one lives in
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatHit" } }
  /workspaces/{workspaceId}/chat/threads:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [chat]
      operationId: listChatThreads
      summary: Threads the caller started or replied in, most recently active first
      responses:
        "200":
          description: Thread roots with the conversation each one lives in
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatHit" } }
  /workspaces/{workspaceId}/chat/presence:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [chat]
      operationId: getChatPresence
      responses:
        "200":
          description: Members seen in the last two minutes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatPresence" }
    post:
      tags: [chat]
      operationId: chatHeartbeat
      summary: Tell the server the caller has the app open
      responses:
        "204": { description: Recorded }
  /workspaces/{workspaceId}/integrations:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [integrations]
      operationId: listIntegrations
      summary: What can be connected and where each stands for the caller
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationList" }
  /workspaces/{workspaceId}/integrations/meetings:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [integrations]
      operationId: listMeetings
      summary: The caller's next calendar meetings, soonest first
      responses:
        "200":
          description: Upcoming meetings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingList" }
  /workspaces/{workspaceId}/integrations/{provider}/connect:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/IntegrationProvider" }
    post:
      tags: [integrations]
      operationId: connectIntegration
      summary: Start connecting an account; returns where to send the browser
      responses:
        "200":
          description: The authorisation address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationConnect" }
        "409": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/integrations/{provider}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/IntegrationProvider" }
    patch:
      tags: [integrations]
      operationId: updateIntegration
      summary: Activate or pause a connection and change its reminders
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationEntry" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [integrations]
      operationId: disconnectIntegration
      summary: Forget the account and its cached events
      responses:
        "204": { description: Disconnected }
  /workspaces/{workspaceId}/integrations/{provider}/sync:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/IntegrationProvider" }
    post:
      tags: [integrations]
      operationId: syncIntegration
      summary: Refresh the connection now
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationEntry" }
  /integrations/{provider}/callback:
    parameters:
      - { $ref: "#/components/parameters/IntegrationProvider" }
    get:
      tags: [integrations]
      operationId: integrationCallback
      summary: Where the provider sends the browser back (redirects to the Integrations page)
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        "302": { description: Redirect }
  /workspaces/{workspaceId}/github:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [github]
      operationId: getGithub
      summary: The workspace's GitHub connection, rules and linked repositories
      responses:
        "200":
          description: The connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GithubSummary" }
    patch:
      tags: [github]
      operationId: updateGithub
      summary: Switch the connection on or off and change its rules (administrators)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GithubPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GithubSummary" }
    delete:
      tags: [github]
      operationId: disconnectGithub
      summary: Remove the webhooks, the token, the repositories and the links (administrators)
      responses:
        "204": { description: Disconnected }
  /workspaces/{workspaceId}/github/token:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    put:
      tags: [github]
      operationId: connectGithub
      summary: Connect with an access token (administrators); the token is checked and stored sealed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GithubTokenInput" }
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GithubSummary" }
        "422": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/github/repos/available:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [github]
      operationId: listGithubRepos
      summary: Repositories the token can reach that are not linked yet (administrators)
      responses:
        "200":
          description: Names
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GithubRepoNames" }
  /workspaces/{workspaceId}/github/repos:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    post:
      tags: [github]
      operationId: linkGithubRepo
      summary: Link a project to a repository and register the webhook (administrators)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GithubRepoInput" }
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GithubRepo" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/github/repos/{repoId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { name: repoId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [github]
      operationId: unlinkGithubRepo
      summary: Unlink a repository and remove its webhook (administrators)
      responses:
        "204": { description: Unlinked }
  /cards/{cardId}/github:
    parameters: [{ $ref: "#/components/parameters/CardId" }]
    get:
      tags: [github]
      operationId: getCardGithub
      summary: Pull requests and issues linked to a card, with a suggested branch name
      responses:
        "200":
          description: The card's GitHub panel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GithubPanel" }
  /cards/{cardId}/github/issue:
    parameters: [{ $ref: "#/components/parameters/CardId" }]
    post:
      tags: [github]
      operationId: createCardGithubIssue
      summary: Open a GitHub issue for the card in its project's repository
      responses:
        "201":
          description: The linked issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GithubLink" }
        "409": { $ref: "#/components/responses/Error" }
  /integrations/github/webhook:
    post:
      tags: [github]
      operationId: githubWebhook
      summary: Where GitHub delivers pull request and issue events (signed with the workspace secret)
      security: []
      responses:
        "204": { description: Accepted }
        "401": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/notifications:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: The caller's notifications in the workspace, newest first, with the unread count
      parameters:
        - { name: before, in: query, required: false, schema: { type: string, format: date-time }, description: Only older than this time }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: A page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
  /workspaces/{workspaceId}/notifications/read:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      summary: Mark the given notifications (or all of them) as read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationsReadInput" }
      responses:
        "204": { description: Marked }
  /workspaces/{workspaceId}/chat/status:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    put:
      tags: [chat]
      operationId: setChatStatus
      summary: Set the caller's status (availability, icon, short text, optional end)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatStatusInput" }
      responses:
        "204": { description: Saved }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [chat]
      operationId: clearChatStatus
      responses:
        "204": { description: Cleared }
  /chat/channels/{channelId}/typing:
    parameters: [{ $ref: "#/components/parameters/ChatChannelId" }]
    post:
      tags: [chat]
      operationId: chatTyping
      summary: Tell the others in the channel the caller is writing (nothing is stored)
      responses:
        "204": { description: Sent }
  /chat/channels/{channelId}/star:
    parameters: [{ $ref: "#/components/parameters/ChatChannelId" }]
    put:
      tags: [chat]
      operationId: starChatChannel
      responses:
        "204": { description: Starred }
    delete:
      tags: [chat]
      operationId: unstarChatChannel
      responses:
        "204": { description: Unstarred }
  /chat/channels/{channelId}/pins:
    parameters: [{ $ref: "#/components/parameters/ChatChannelId" }]
    get:
      tags: [chat]
      operationId: listChatPins
      responses:
        "200":
          description: Pinned messages, latest pin first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
  /chat/channels/{channelId}/files:
    parameters: [{ $ref: "#/components/parameters/ChatChannelId" }]
    get:
      tags: [chat]
      operationId: listChatFiles
      responses:
        "200":
          description: Files sent in the channel, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatFile" } }
    post:
      tags: [chat]
      operationId: uploadChatFile
      description: Multipart upload (field `file`). The file is attached by sending its id in a message's `fileIds`
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored, not yet attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatFile" }
        "413": { $ref: "#/components/responses/Error" }
  /chat/files/{fileId}/content:
    parameters: [{ name: fileId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [chat]
      operationId: getChatFile
      description: Bytes of an attachment for anybody who can read its conversation. Only known image types may be shown inline
      responses:
        "200": { description: File bytes }
        "404": { $ref: "#/components/responses/Error" }
  /chat/messages/{messageId}/save:
    parameters: [{ $ref: "#/components/parameters/ChatMessageId" }]
    put:
      tags: [chat]
      operationId: saveChatMessage
      responses:
        "200":
          description: Saved for later
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
    delete:
      tags: [chat]
      operationId: unsaveChatMessage
      responses:
        "200":
          description: Removed from saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
  /chat/messages/{messageId}/pin:
    parameters: [{ $ref: "#/components/parameters/ChatMessageId" }]
    put:
      tags: [chat]
      operationId: pinChatMessage
      responses:
        "200":
          description: Pinned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
    delete:
      tags: [chat]
      operationId: unpinChatMessage
      responses:
        "200":
          description: Unpinned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
  /chat/channels/{channelId}:
    parameters: [{ $ref: "#/components/parameters/ChatChannelId" }]
    patch:
      tags: [chat]
      operationId: updateChatChannel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatChannelPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatChannel" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [chat]
      operationId: archiveChatChannel
      summary: Archive a channel (creator or workspace admin)
      responses:
        "204": { description: Archived }
  /chat/channels/{channelId}/members:
    parameters: [{ $ref: "#/components/parameters/ChatChannelId" }]
    get:
      tags: [chat]
      operationId: listChatMembers
      responses:
        "200":
          description: People in the channel
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PersonRef" } }
    post:
      tags: [chat]
      operationId: addChatMembers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMembersInput" }
      responses:
        "204": { description: Added }
  /chat/channels/{channelId}/join:
    parameters: [{ $ref: "#/components/parameters/ChatChannelId" }]
    post:
      tags: [chat]
      operationId: joinChatChannel
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatChannel" }
  /chat/channels/{channelId}/leave:
    parameters: [{ $ref: "#/components/parameters/ChatChannelId" }]
    post:
      tags: [chat]
      operationId: leaveChatChannel
      responses:
        "204": { description: Left }
  /chat/channels/{channelId}/read:
    parameters: [{ $ref: "#/components/parameters/ChatChannelId" }]
    post:
      tags: [chat]
      operationId: markChatRead
      summary: Mark the channel as read up to now
      responses:
        "204": { description: Marked }
  /chat/channels/{channelId}/notify:
    parameters: [{ $ref: "#/components/parameters/ChatChannelId" }]
    put:
      tags: [chat]
      operationId: setChatNotify
      summary: Choose how loudly the channel notifies the caller
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatNotifyInput" }
      responses:
        "204": { description: Saved }
  /chat/channels/{channelId}/messages:
    parameters: [{ $ref: "#/components/parameters/ChatChannelId" }]
    get:
      tags: [chat]
      operationId: listChatMessages
      summary: A page of top-level messages, oldest first within the page
      parameters:
        - name: before
          in: query
          description: Id of the oldest message already loaded; returns the page before it
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Newest page when `before` is omitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessagePage" }
    post:
      tags: [chat]
      operationId: postChatMessage
      summary: Send a message, or a reply when parentId is set
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMessageInput" }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "422": { $ref: "#/components/responses/Error" }
  /chat/messages/{messageId}:
    parameters: [{ $ref: "#/components/parameters/ChatMessageId" }]
    patch:
      tags: [chat]
      operationId: editChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatBodyInput" }
      responses:
        "200":
          description: Edited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [chat]
      operationId: deleteChatMessage
      responses:
        "204": { description: Deleted }
  /chat/messages/{messageId}/thread:
    parameters: [{ $ref: "#/components/parameters/ChatMessageId" }]
    get:
      tags: [chat]
      operationId: getChatThread
      responses:
        "200":
          description: The root message followed by its replies, oldest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
  /chat/messages/{messageId}/reactions/{key}:
    parameters:
      - { $ref: "#/components/parameters/ChatMessageId" }
      - name: key
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 32, description: A built-in icon key or an emoji }
    put:
      tags: [chat]
      operationId: addChatReaction
      responses:
        "200":
          description: Reacted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
    delete:
      tags: [chat]
      operationId: removeChatReaction
      responses:
        "200":
          description: Reaction removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: lk_at }
  parameters:
    IntegrationProvider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google_calendar] }
    ChatChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChatMessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google, github] }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 500 }
    CardStatus: { name: status, in: query, schema: { $ref: "#/components/schemas/TaskStatus" } }
    CardProjectId: { name: projectId, in: query, schema: { type: string, format: uuid } }
    CardAssigneeId: { name: assigneeId, in: query, schema: { type: string, format: uuid } }
    CardPriority: { name: priority, in: query, schema: { $ref: "#/components/schemas/Priority" } }
    CardQuery: { name: q, in: query, schema: { type: string }, description: Search in title or key (e.g. LK-12) }
    CardLabelId: { name: labelId, in: query, schema: { type: string, format: uuid } }
    CardParentId: { name: parentId, in: query, description: Only subtasks of this card, schema: { type: string, format: uuid } }
    ColumnId: { name: columnId, in: path, required: true, schema: { type: string, format: uuid } }
    ViewId: { name: viewId, in: path, required: true, schema: { type: string, format: uuid } }
    LabelId: { name: labelId, in: path, required: true, schema: { type: string, format: uuid } }
    ItemId: { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    CommentId: { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    TimeEntryId: { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
    AttachmentId: { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
    WikiSpaceId: { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
    WikiNodeId: { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
    WikiPrincipalKind: { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/WikiPrincipalKind" } }
    WikiPrincipalId: { name: principalId, in: path, required: true, schema: { type: string, format: uuid } }
    CardDue: { name: due, in: query, schema: { type: string, enum: [overdue, today, week, month, none] } }
  responses:
    Session:
      description: Authenticated session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: auth.invalid_credentials }
            message: { type: string }
            fields:
              type: array
              items: { $ref: "#/components/schemas/FieldError" }
            meta:
              type: object
              additionalProperties: true
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string, example: min_length }
        params: { type: object, additionalProperties: true }
    CsrfToken:
      type: object
      required: [token]
      properties:
        token: { type: string }
    AuthProviders:
      type: object
      required: [google, github]
      properties:
        google: { type: boolean }
        github: { type: boolean }
    Locale:
      type: string
      enum: [en, uk]
    User:
      type: object
      required: [id, email, name, locale, avatarUrl, emailVerified, hasPassword, providers, createdAt, jobTitle, phone, location, timezone, bio, pronouns, linkedin, telegram, website, workStart, workEnd, skills, coverPreset, coverUrl]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, description: Email address (validated server-side) }
        name: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        avatarUrl: { type: string, nullable: true }
        emailVerified: { type: boolean }
        hasPassword: { type: boolean }
        providers:
          type: array
          items: { type: string, enum: [google, github] }
        createdAt: { type: string, format: date-time }
        jobTitle: { type: string }
        phone: { type: string }
        location: { type: string }
        timezone: { type: string, description: IANA time zone name, empty when not set }
        bio: { type: string }
        pronouns: { type: string }
        linkedin: { type: string, description: Full LinkedIn address, empty when not set }
        telegram: { type: string, description: Telegram user name without the @, empty when not set }
        website: { type: string }
        workStart: { type: string, description: "Working day start, HH:MM, empty when not set" }
        workEnd: { type: string }
        skills: { type: array, items: { type: string } }
        coverPreset: { type: string, description: Id of a ready-made profile background, empty when none }
        coverUrl: { type: string, nullable: true, description: Uploaded profile background, if any }
    Session:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, description: Email address (validated server-side) }
        password: { type: string, minLength: 10, maxLength: 128 }
        locale: { $ref: "#/components/schemas/Locale" }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string }
    TwoFactorStatus:
      type: object
      required: [enabled, recoveryRemaining]
      properties:
        enabled: { type: boolean }
        recoveryRemaining: { type: integer }
    TwoFactorSetup:
      type: object
      required: [secret, uri]
      properties:
        secret: { type: string, description: Base32 secret for manual entry }
        uri: { type: string, description: otpauth:// address for the QR code }
    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes: { type: array, items: { type: string } }
    TwoFactorDisableRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: A current code or a recovery code }
        password: { type: string, description: The current password, when the account has one }
    TwoFactorLoginRequest:
      type: object
      required: [token, code]
      properties:
        token: { type: string, description: The token from the auth.two_factor_required error }
        code: { type: string }
    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword: { type: string, description: Required when the account already has a password }
        newPassword: { type: string }
    Device:
      type: object
      required: [id, startedAt, lastSeenAt, userAgent, ip, current]
      properties:
        id: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time, description: When the sign-in was last renewed }
        userAgent: { type: string }
        ip: { type: string }
        current: { type: boolean, description: This is the device making the request }
    DeviceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Device" } }
    UpdateProfileRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        locale: { $ref: "#/components/schemas/Locale" }
        jobTitle: { type: string, maxLength: 100, description: Empty string clears }
        phone: { type: string, maxLength: 40 }
        location: { type: string, maxLength: 100 }
        timezone: { type: string, description: IANA time zone name or empty }
        bio: { type: string, maxLength: 500 }
        pronouns: { type: string, maxLength: 30 }
        linkedin: { type: string, description: A LinkedIn address or just the handle; empty clears }
        telegram: { type: string, description: "@name, t.me/name or just the name; empty clears" }
        website: { type: string, maxLength: 200 }
        workStart: { type: string, description: "HH:MM; send with workEnd, both empty clears" }
        workEnd: { type: string }
        skills: { type: array, maxItems: 10, items: { type: string, maxLength: 30 } }
        coverPreset: { type: string, description: "A preset id (a preset replaces an uploaded cover); empty clears the preset" }
    Role:
      type: string
      enum: [owner, admin, member, viewer]
    InviteRole:
      type: string
      enum: [admin, member, viewer]
    Workspace:
      type: object
      required: [id, name, slug, role, memberCount, createdAt, permissions, customRole]
      properties:
