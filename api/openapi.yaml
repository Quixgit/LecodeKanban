openapi: 3.0.3
info:
  title: LecodeKanban API
  version: 0.3.0
  description: |
    REST API of LecodeKanban. Source of truth for Go DTOs and the TypeScript client (`make gen`).

    **Auth:** httpOnly cookies — `lk_at` (access, ~15 min) and `lk_rt` (rotating refresh,
    path-scoped to `/api/v1/auth`). **CSRF:** every non-GET request must echo the `lk_csrf`
    cookie in the `X-CSRF-Token` header (obtain it via `GET /auth/csrf`).

    **Errors** are `{"error": {"code", "message", "fields"?, "meta"?}}`. `code` is stable and
    translated by clients; `message` is an English developer hint. See `GET /i18n/error-codes`.
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: users
  - name: workspaces
  - name: projects
  - name: boards
  - name: cards
  - name: system

paths:
  /auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrf
      summary: Issue the CSRF cookie
      security: []
      responses:
        "200":
          description: CSRF token (also set as the lk_csrf cookie)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfToken" }
  /auth/providers:
    get:
      tags: [auth]
      operationId: getAuthProviders
      summary: Which OAuth providers are configured
      security: []
      responses:
        "200":
          description: Provider availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthProviders" }
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      security: []
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security: []
      responses:
        "204": { description: Logged out (cookies cleared) }
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "204": { description: Email verified }
        "400": { $ref: "#/components/responses/Error" }
  /auth/verify-email/resend:
    post:
      tags: [auth]
      operationId: resendVerification
      responses:
        "204": { description: Verification email queued (no-op if already verified) }
        "429": { $ref: "#/components/responses/Error" }
  /auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "204": { description: Always succeeds to avoid account enumeration }
        "429": { $ref: "#/components/responses/Error" }
  /auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Password changed; all sessions revoked }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/oauth/{provider}/start:
    get:
      tags: [auth]
      operationId: oauthStart
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: next
          in: query
          description: Relative path to return to after sign-in
          schema: { type: string }
      responses:
        "302": { description: Redirect to the provider }
        "404": { $ref: "#/components/responses/Error" }
  /auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      operationId: oauthCallback
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: "Redirect back to the app (with ?error=<code> on failure)" }

  /users/me:
    get:
      tags: [users]
      operationId: getMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      tags: [users]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/Error" }
  /users/me/password:
    post:
      tags: [users]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed; other sessions revoked }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: Workspaces the caller belongs to (a personal one is created on first call if none)
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "422": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspaces]
      operationId: getWorkspace
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [workspaces]
      operationId: updateWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [workspaces]
      operationId: deleteWorkspace
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/members:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspaces]
      operationId: listMembers
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [workspaces]
      operationId: updateMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemberRequest" }
      responses:
        "204": { description: Role updated }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [workspaces]
      operationId: removeMember
      summary: Remove a member (or leave, when userId is the caller)
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/invites:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [workspaces]
      operationId: listInvites
      responses:
        "200":
          description: Open invites
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invite" }
    post:
      tags: [workspaces]
      operationId: createInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInviteRequest" }
      responses:
        "201":
          description: Invite created and emailed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - { name: inviteId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [workspaces]
      operationId: revokeInvite
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /invites/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      tags: [workspaces]
      operationId: previewInvite
      security: []
      responses:
        "200":
          description: Invite details for the acceptance screen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "404": { $ref: "#/components/responses/Error" }
  /invites/{token}/accept:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      tags: [workspaces]
      operationId: acceptInvite
      responses:
        "200":
          description: Joined workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "403": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/projects:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [projects]
      operationId: listProjects
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Search in name or key }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ProjectStatus" } }
        - { name: picId, in: query, schema: { type: string, format: uuid } }
        - { name: team, in: query, schema: { type: string } }
        - { name: progress, in: query, schema: { type: string, enum: [not_started, early, midway, almost, done] } }
        - { name: deadline, in: query, schema: { type: string, enum: [overdue, week, month, later, none] } }
        - { name: sort, in: query, schema: { type: string, enum: [updated, name, deadline, progress, created] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Projects page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPage" }
    post:
      tags: [projects]
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/projects/summary:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [projects]
      operationId: projectSummary
      responses:
        "200":
          description: KPI counts and filter facets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectSummary" }
  /projects/{projectId}:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [projects]
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [projects]
      operationId: archiveProject
      responses:
        "204": { description: Archived }
        "403": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/board:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [boards]
      operationId: getBoard
      responses:
        "200":
          description: Board with ordered columns
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
  /workspaces/{workspaceId}/cards:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [cards]
      operationId: listCards
      parameters:
        - $ref: "#/components/parameters/CardStatus"
        - $ref: "#/components/parameters/CardProjectId"
        - $ref: "#/components/parameters/CardAssigneeId"
        - $ref: "#/components/parameters/CardPriority"
        - $ref: "#/components/parameters/CardQuery"
        - $ref: "#/components/parameters/CardDue"
        - { name: sort, in: query, schema: { type: string, enum: [key, title, assignee, project, progress, deadline, priority, position, updated] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Cards page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardPage" }
    post:
      tags: [cards]
      operationId: createCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "422": { $ref: "#/components/responses/Error" }
  /workspaces/{workspaceId}/cards/summary:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [cards]
      operationId: cardStatusCounts
      parameters:
        - $ref: "#/components/parameters/CardProjectId"
        - $ref: "#/components/parameters/CardAssigneeId"
        - $ref: "#/components/parameters/CardPriority"
        - $ref: "#/components/parameters/CardQuery"
        - $ref: "#/components/parameters/CardDue"
      responses:
        "200":
          description: Card counts per status for the same filters as listCards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusCounts" }
  /workspaces/{workspaceId}/cards/bulk:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    post:
      tags: [cards]
      operationId: bulkCards
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkCardAction" }
      responses:
        "200":
          description: Number of cards changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
  /workspaces/{workspaceId}/cards/stats:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [cards]
      operationId: cardStats
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 7, maximum: 31 } }
      responses:
        "200":
          description: Dashboard KPIs, daily activity and recent transitions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardStats" }
  /cards/{cardId}:
    parameters: [{ $ref: "#/components/parameters/CardId" }]
    get:
      tags: [cards]
      operationId: getCard
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [cards]
      operationId: updateCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [cards]
      operationId: deleteCard
      responses:
        "204": { description: Archived }
  /cards/{cardId}/move:
    parameters: [{ $ref: "#/components/parameters/CardId" }]
    post:
      tags: [cards]
      operationId: moveCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardMove" }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "409": { $ref: "#/components/responses/Error" }

  /i18n/error-codes:
    get:
      tags: [system]
      operationId: listErrorCodes
      security: []
      responses:
        "200":
          description: Every error code the API can return
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: lk_at }
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google, github] }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 500 }
    CardStatus: { name: status, in: query, schema: { $ref: "#/components/schemas/TaskStatus" } }
    CardProjectId: { name: projectId, in: query, schema: { type: string, format: uuid } }
    CardAssigneeId: { name: assigneeId, in: query, schema: { type: string, format: uuid } }
    CardPriority: { name: priority, in: query, schema: { $ref: "#/components/schemas/Priority" } }
    CardQuery: { name: q, in: query, schema: { type: string }, description: Search in title or key (e.g. LK-12) }
    CardDue: { name: due, in: query, schema: { type: string, enum: [overdue, today, week, month, none] } }
  responses:
    Session:
      description: Authenticated session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: auth.invalid_credentials }
            message: { type: string }
            fields:
              type: array
              items: { $ref: "#/components/schemas/FieldError" }
            meta:
              type: object
              additionalProperties: true
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string, example: min_length }
        params: { type: object, additionalProperties: true }
    CsrfToken:
      type: object
      required: [token]
      properties:
        token: { type: string }
    AuthProviders:
      type: object
      required: [google, github]
      properties:
        google: { type: boolean }
        github: { type: boolean }
    Locale:
      type: string
      enum: [en, uk]
    User:
      type: object
      required: [id, email, name, locale, avatarUrl, emailVerified, hasPassword, providers, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, description: Email address (validated server-side) }
        name: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        avatarUrl: { type: string, nullable: true }
        emailVerified: { type: boolean }
        hasPassword: { type: boolean }
        providers:
          type: array
          items: { type: string, enum: [google, github] }
        createdAt: { type: string, format: date-time }
    Session:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, description: Email address (validated server-side) }
        password: { type: string, minLength: 10, maxLength: 128 }
        locale: { $ref: "#/components/schemas/Locale" }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string }
    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword: { type: string, description: Required when the account already has a password }
        newPassword: { type: string }
    UpdateProfileRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        locale: { $ref: "#/components/schemas/Locale" }
    Role:
      type: string
      enum: [owner, admin, member, viewer]
    InviteRole:
      type: string
      enum: [admin, member, viewer]
    Workspace:
      type: object
      required: [id, name, slug, role, memberCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }
    WorkspaceInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    MemberUser:
      type: object
      required: [id, name, email, avatarUrl]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        avatarUrl: { type: string, nullable: true }
    Member:
      type: object
      required: [user, role, joinedAt]
      properties:
        user: { $ref: "#/components/schemas/MemberUser" }
        role: { $ref: "#/components/schemas/Role" }
        joinedAt: { type: string, format: date-time }
    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    Invite:
      type: object
      required: [id, email, role, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/InviteRole" }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    CreateInviteRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, description: Email address (validated server-side) }
        role: { $ref: "#/components/schemas/InviteRole" }
    InvitePreview:
      type: object
      required: [workspaceName, inviterName, email, role, expired, accepted]
      properties:
        workspaceName: { type: string }
        inviterName: { type: string, nullable: true }
        email: { type: string }
        role: { $ref: "#/components/schemas/InviteRole" }
        expired: { type: boolean }
        accepted: { type: boolean }
    TaskStatus:
      type: string
      enum: [todo, in_progress, in_review, done]
    Priority:
      type: string
      enum: [high, medium, low]
    ProjectStatus:
      type: string
      enum: [pending, in_progress, completed]
    Tone:
      type: string
      enum: [teal, amber, purple, red, neutral]
    ProjectIcon:
      type: string
      enum: [folder, rocket, shield, code, target, sparkles, globe, megaphone, layers, flask]
    PersonRef:
      type: object
      required: [id, name, avatarUrl]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
    ProjectRef:
      type: object
      required: [id, key, name, tone, icon]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        tone: { $ref: "#/components/schemas/Tone" }
        icon: { $ref: "#/components/schemas/ProjectIcon" }
    Project:
      type: object
      required: [id, key, name, description, status, overdue, pic, picRole, team, icon, tone, startDate, deadline, taskCount, doneCount, progress, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: LK }
        name: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        overdue: { type: boolean }
        pic:
          allOf: [{ $ref: "#/components/schemas/PersonRef" }]
          nullable: true
        picRole:
          allOf: [{ $ref: "#/components/schemas/Role" }]
          nullable: true
        team: { type: string, nullable: true }
        icon: { $ref: "#/components/schemas/ProjectIcon" }
        tone: { $ref: "#/components/schemas/Tone" }
        startDate: { type: string, format: date, nullable: true }
        deadline: { type: string, format: date, nullable: true }
        taskCount: { type: integer }
        doneCount: { type: integer }
        progress: { type: integer, minimum: 0, maximum: 100 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        key: { type: string, description: "2–6 uppercase letters/digits; derived from the name when omitted" }
        description: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        picId: { type: string, format: uuid }
        team: { type: string }
        icon: { $ref: "#/components/schemas/ProjectIcon" }
        tone: { $ref: "#/components/schemas/Tone" }
        startDate: { type: string, format: date }
        deadline: { type: string, format: date }
    ProjectPatch:
      type: object
      description: Absent fields are unchanged; null clears nullable fields.
      properties:
        name: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        picId: { type: string, format: uuid, nullable: true }
        team: { type: string, nullable: true }
        icon: { $ref: "#/components/schemas/ProjectIcon" }
        tone: { $ref: "#/components/schemas/Tone" }
        startDate: { type: string, format: date, nullable: true }
        deadline: { type: string, format: date, nullable: true }
    ProjectPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Project" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    ProjectSummary:
      type: object
      required: [total, completed, inProgress, pending, overdue, teams]
      properties:
        total: { type: integer }
        completed: { type: integer }
        inProgress: { type: integer }
        pending: { type: integer }
        overdue: { type: integer }
        teams: { type: array, items: { type: string } }
    BoardColumn:
      type: object
      required: [id, name, status, position, wipLimit]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        position: { type: string }
        wipLimit: { type: integer, nullable: true }
    Board:
      type: object
      required: [id, projectId, name, columns]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        columns: { type: array, items: { $ref: "#/components/schemas/BoardColumn" } }
    Card:
      type: object
      required: [id, key, number, title, description, status, columnId, priority, progress, dueDate, project, assignees, position, version, createdAt, updatedAt, completedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: LK-12 }
        number: { type: integer }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        columnId: { type: string, format: uuid }
        priority: { $ref: "#/components/schemas/Priority" }
        progress: { type: integer, minimum: 0, maximum: 100 }
        dueDate: { type: string, format: date, nullable: true }
        project: { $ref: "#/components/schemas/ProjectRef" }
        assignees: { type: array, items: { $ref: "#/components/schemas/PersonRef" } }
        position: { type: string }
        version: { type: integer, description: Optimistic concurrency token; send it back on update/move }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    CardInput:
      type: object
      required: [projectId, title]
      properties:
        projectId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        columnId: { type: string, format: uuid }
        priority: { $ref: "#/components/schemas/Priority" }
        progress: { type: integer, minimum: 0, maximum: 100 }
        dueDate: { type: string, format: date }
        assigneeIds: { type: array, items: { type: string, format: uuid } }
    CardPatch:
      type: object
      required: [version]
      description: Absent fields are unchanged; dueDate null clears it.
      properties:
        version: { type: integer }
        title: { type: string }
        description: { type: string }
        priority: { $ref: "#/components/schemas/Priority" }
        progress: { type: integer, minimum: 0, maximum: 100 }
        dueDate: { type: string, format: date, nullable: true }
        assigneeIds: { type: array, items: { type: string, format: uuid } }
    CardMove:
      type: object
      required: [version]
      description: Target column (or status → its first column) and neighbours; omitted neighbours append to the end.
      properties:
        version: { type: integer }
        columnId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/TaskStatus" }
        afterId: { type: string, format: uuid, nullable: true, description: Card that will be directly above }
        beforeId: { type: string, format: uuid, nullable: true, description: Card that will be directly below }
    CardPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Card" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    StatusCounts:
      type: object
      required: [todo, in_progress, in_review, done]
      properties:
        todo: { type: integer }
        in_progress: { type: integer }
        in_review: { type: integer }
        done: { type: integer }
    BulkCardAction:
      type: object
      required: [ids, action]
      properties:
        ids: { type: array, items: { type: string, format: uuid }, maxItems: 500 }
        action: { type: string, enum: [move, priority, delete] }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
    BulkResult:
      type: object
      required: [updated]
      properties:
        updated: { type: integer }
    DailyActivity:
      type: object
      required: [date, todo, in_progress, in_review, done]
      properties:
        date: { type: string, format: date }
        todo: { type: integer, description: Cards created }
        in_progress: { type: integer }
        in_review: { type: integer }
        done: { type: integer }
    ActivityItem:
      type: object
      required: [id, card, project, actor, from, to, at]
      properties:
        id: { type: integer, format: int64 }
        card:
          type: object
          required: [id, key, title]
          properties:
            id: { type: string, format: uuid }
            key: { type: string }
            title: { type: string }
        project: { $ref: "#/components/schemas/ProjectRef" }
        actor:
          allOf: [{ $ref: "#/components/schemas/PersonRef" }]
          nullable: true
        from:
          allOf: [{ $ref: "#/components/schemas/TaskStatus" }]
          nullable: true
        to: { $ref: "#/components/schemas/TaskStatus" }
        at: { type: string, format: date-time }
    Trend:
      type: object
      required: [value, previous, changePct]
      properties:
        value: { type: integer }
        previous: { type: integer }
        changePct: { type: number, description: "Percent change vs previous period (0 when previous is 0)" }
    DashboardStats:
      type: object
      required: [active, total, inReview, overdue, completedThisWeek, createdThisWeek, statusCounts, daily, activity]
      properties:
        active: { type: integer }
        total: { type: integer }
        inReview: { type: integer }
        overdue: { type: integer }
        completedThisWeek: { $ref: "#/components/schemas/Trend" }
        createdThisWeek: { $ref: "#/components/schemas/Trend" }
        statusCounts: { $ref: "#/components/schemas/StatusCounts" }
        daily: { type: array, items: { $ref: "#/components/schemas/DailyActivity" } }
        activity: { type: array, items: { $ref: "#/components/schemas/ActivityItem" } }
security:
  - cookieAuth: []
